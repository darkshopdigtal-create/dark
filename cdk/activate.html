<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">إتمام التفعيل</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0f19; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; position: relative; }
        
        .lang-switcher { position: absolute; top: 25px; left: 25px; background: rgba(30, 41, 59, 0.7); border: 1px solid #334155; color: #38bdf8; padding: 5px 12px; border-radius: 20px; cursor: pointer; font-size: 12px; font-weight: 600; transition: all 0.2s; }
        .lang-switcher:hover { background: #1e293b; border-color: #38bdf8; }

        .container { background-color: #1e293b; padding: 35px; border-radius: 16px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4); width: 100%; max-width: 480px; border: 1px solid #334155; }
        h2 { text-align: center; margin-bottom: 20px; color: #f8fafc; font-size: 20px; font-weight: 600; }
        
        .instructions { background-color: #0f172a; border: 1px solid #334155; padding: 15px; border-radius: 10px; margin-bottom: 20px; font-size: 12px; color: #94a3b8; line-height: 1.6; }
        .instructions h4 { color: #38bdf8; margin-bottom: 6px; font-size: 13px; }
        .instructions ol { padding-right: 15px; }
        .instructions li { margin-bottom: 4px; }
        .instructions a { color: #38bdf8; text-decoration: none; }

        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 13px; color: #94a3b8; font-weight: 500; }
        textarea { width: 100%; height: 90px; padding: 12px; background-color: #0f172a; border: 1px solid #334155; border-radius: 10px; color: white; font-size: 12px; outline: none; resize: none; }
        textarea:focus { border-color: #38bdf8; }
        
        button[type="submit"] { width: 100%; padding: 12px; background-color: #16a34a; border: none; border-radius: 10px; color: white; font-size: 15px; font-weight: 600; cursor: pointer; transition: background-color 0.2s; }
        button[type="submit"]:hover { background-color: #15803d; }
        
        #status-message { margin-top: 15px; text-align: center; font-size: 13px; }
        .loading { color: #facc15; } .success { color: #4ade80; } .error { color: #f87171; }
    </style>
</head>
<body>

    <button class="lang-switcher" onclick="toggleLanguage()" id="lang-btn">EN</button>

    <div class="container">
        <h2 id="title-text">ربط الحساب والتفعيل</h2>
        
        <div class="instructions" id="instructions-box">
            <h4 id="inst-title">خطوات جلب الجلسة:</h4>
            <ol>
                <li id="inst-1">سجل دخولك إلى <a href="https://chatgpt.com" target="_blank">ChatGPT</a>.</li>
                <li id="inst-2">افتح الرابط التالي في نفس المتصفح: <a href="https://chatgpt.com/api/auth/session" target="_blank">api/auth/session</a></li>
                <li id="inst-3">انسخ محتوى الصفحة بالكامل واصقه أدناه.</li>
            </ol>
        </div>

        <form id="activate-form">
            <div class="form-group">
                <label for="session_data" id="label-session">بيانات الجلسة (JSON)</label>
                <textarea id="session_data" placeholder='{"user": {...}}' required></textarea>
            </div>

            <button type="submit" id="submit-btn">بدء التفعيل الفوري</button>
        </form>
        <div id="status-message"></div>
    </div>

    <script>
        let currentLang = 'ar';
        const texts = {
            ar: {
                btnLang: "EN",
                titleText: "ربط الحساب والتفعيل",
                instTitle: "خطوات جلب الجلسة:",
                inst1: 'سجل دخولك إلى <a href="https://chatgpt.com" target="_blank">ChatGPT</a>.',
                inst2: 'افتح الرابط التالي في نفس المتصفح: <a href="https://chatgpt.com/api/auth/session" target="_blank">api/auth/session</a>',
                inst3: "انسخ محتوى الصفحة بالكامل واصقه أدناه.",
                labelSession: "بيانات الجلسة (JSON)",
                submitBtn: "بدء التفعيل الفوري",
                loading: "جاري التفعيل التلقائي (قد يستغرق دقيقة)...",
                success: "تم التفعيل بنجاح! تم ترقية حسابك إلى Business.",
                error: "فشل التفعيل: الكود لم يُحرق، يرجى المحاولة مرة أخرى.",
                missingCdk: "الرجاء إدخال الكود أولاً!"
            },
            en: {
                btnLang: "AR",
                titleText: "Link & Activate Account",
                instTitle: "Session Steps:",
                inst1: 'Log in to <a href="https://chatgpt.com" target="_blank">ChatGPT</a>.',
                inst2: 'Open this link in the same browser: <a href="https://chatgpt.com/api/auth/session" target="_blank">api/auth/session</a>',
                inst3: "Copy all page content and paste it below.",
                labelSession: "Session Data (JSON)",
                submitBtn: "Start Instant Activation",
                loading: "Auto-activating (takes about a minute)...",
                success: "Activated successfully! Upgraded to Business.",
                error: "Activation failed: Code is safe, please try again.",
                missingCdk: "Please enter the code first!"
            }
        };

        function toggleLanguage() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            const t = texts[currentLang];
            document.getElementById('html-root').setAttribute('dir', currentLang === 'ar' ? 'rtl' : 'ltr');
            document.getElementById('html-root').setAttribute('lang', currentLang);
            document.getElementById('lang-btn').innerText = t.btnLang;
            document.getElementById('title-text').innerText = t.titleText;
            document.getElementById('inst-title').innerText = t.instTitle;
            document.getElementById('inst-1').innerHTML = t.inst1;
            document.getElementById('inst-2').innerHTML = t.inst2;
            document.getElementById('inst-3').innerText = t.inst3;
            document.getElementById('label-session').innerText = t.labelSession;
            document.getElementById('submit-btn').innerText = t.submitBtn;
        }

        const cdk = localStorage.getItem('valid_cdk');
        if (!cdk) {
            alert(texts.ar.missingCdk);
            window.location.href = 'index.html';
        }

        document.getElementById('activate-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const sessionData = document.getElementById('session_data').value.trim();
            const statusDiv = document.getElementById('status-message');
            const submitBtn = document.getElementById('submit-btn');
            const t = texts[currentLang];

            statusDiv.className = 'loading';
            statusDiv.innerText = t.loading;
            submitBtn.disabled = true;

            try {
                JSON.parse(sessionData); // التحقق من أن المدخلات JSON سليم

                const response = await fetch('/api/activate-business', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cdk, sessionData })
                });

                const data = await response.json();

                if (response.ok) {
                    statusDiv.className = 'success';
                    statusDiv.innerText = t.success;
                    localStorage.removeItem('valid_cdk'); // هنا فقط يُحذف الكود بعد النجاح التام
                } else {
                    statusDiv.className = 'error';
                    statusDiv.innerText = t.error + ' (' + (data.message || '') + ')';
                    submitBtn.disabled = false;
                }
            } catch (error) {
                statusDiv.className = 'error';
                statusDiv.innerText = currentLang === 'ar' ? 'صيغة الـ JSON غير صالحة.' : 'Invalid JSON format.';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
