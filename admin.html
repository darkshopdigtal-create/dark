<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - Alpha Digital</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .card { background-color: #1e293b; padding: 25px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #334155; }
        h2 { margin-bottom: 20px; color: #38bdf8; text-align: center; }
        input { width: 100%; padding: 12px; background-color: #0b0f19; border: 1px solid #334155; border-radius: 8px; color: white; margin-bottom: 15px; outline: none; }
        input:focus { border-color: #38bdf8; }
        button { width: 100%; padding: 12px; background-color: #0284c7; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
        button:hover { background-color: #0369a1; }
        .btn-success { background-color: #16a34a; }
        .btn-success:hover { background-color: #15803d; }
        .code-list { background-color: #0b0f19; padding: 15px; border-radius: 8px; max-height: 300px; overflow-y: auto; }
        .code-item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #1e293b; }
        .active-status { color: #4ade80; font-weight: bold; }
        .used-status { color: #f87171; font-weight: bold; }
        #dashboard { display: none; }
        .message { text-align: center; margin-bottom: 15px; font-size: 14px; }
        .error { color: #f87171; }
        .success { color: #4ade80; }
    </style>
</head>
<body>

    <div class="container">
        <!-- شاشة تسجيل الدخول -->
        <div id="login-screen" class="card">
            <h2>تسجيل الدخول للإدارة</h2>
            <div id="login-msg" class="message"></div>
            <input type="password" id="admin-password" placeholder="أدخل رمز الأدمن السري...">
            <button onclick="login()">تسجيل الدخول</button>
        </div>

        <!-- لوحة التحكم (تظهر بعد تسجيل الدخول) -->
        <div id="dashboard">
            <div class="card">
                <h2>نظام توليد الأكواد (Alpha Digital)</h2>
                <button class="btn-success" onclick="generateCode()">+ توليد كود تفعيل جديد (CDK)</button>
                <div id="action-msg" class="message"></div>
            </div>

            <div class="card">
                <h3>الأكواد الحالية في السيرفر</h3>
                <br>
                <div class="code-list" id="codes-container">
                    <!-- يتم جلب الأكواد هنا -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // التحقق من وجود توكن محفوظ مسبقاً
        let authToken = localStorage.getItem('adminToken');
        if (authToken) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            fetchData();
        }

        // دالة تسجيل الدخول
        async function login() {
            const password = document.getElementById('admin-password').value;
            const msgDiv = document.getElementById('login-msg');
            msgDiv.className = 'message';
            msgDiv.innerText = 'جاري التحقق...';

            try {
                // الاتصال بمسار السيرفر الحقيقي (Relative Path)
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });

                const data = await res.json();

                if (res.ok) {
                    authToken = data.token;
                    localStorage.setItem('adminToken', authToken);
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('dashboard').style.display = 'block';
                    fetchData();
                } else {
                    msgDiv.className = 'message error';
                    msgDiv.innerText = data.message || 'رمز الدخول خاطئ!';
                }
            } catch (err) {
                msgDiv.className = 'message error';
                msgDiv.innerText = 'خطأ في الاتصال بالسيرفر!';
            }
        }

        // دالة جلب الأكواد
        async function fetchData() {
            try {
                const res = await fetch('/api/admin/data', {
                    headers: { 'Authorization': authToken }
                });
                
                if (res.status === 403 || res.status === 401) {
                    logout();
                    return;
                }

                const data = await res.json();
                const container = document.getElementById('codes-container');
                container.innerHTML = '';

                // عرض الأكواد بشكل عكسي (الجديد أولاً)
                const codes = Object.entries(data.codes || {}).reverse();
                
                codes.forEach(([code, info]) => {
                    const statusClass = info.status === 'active' ? 'active-status' : 'used-status';
                    const statusText = info.status === 'active' ? 'فعال (جاهز)' : 'مستخدم (محروق)';
                    
                    container.innerHTML += `
                        <div class="code-item">
                            <span style="font-family: monospace; font-size: 16px;">${code}</span>
                            <span class="${statusClass}">${statusText}</span>
                        </div>
                    `;
                });
            } catch (err) {
                console.error('Fetch error:', err);
            }
        }

        // دالة توليد كود جديد
        async function generateCode() {
            const msgDiv = document.getElementById('action-msg');
            msgDiv.className = 'message';
            msgDiv.innerText = 'جاري التوليد...';

            try {
                const res = await fetch('/api/admin/generate', {
                    method: 'POST',
                    headers: { 'Authorization': authToken }
                });

                const data = await res.json();
                if (res.ok) {
                    msgDiv.className = 'message success';
                    msgDiv.innerText = `تم توليد الكود: ${data.newCode}`;
                    fetchData(); // تحديث القائمة
                } else {
                    msgDiv.className = 'message error';
                    msgDiv.innerText = 'فشل في توليد الكود';
                }
            } catch (err) {
                msgDiv.className = 'message error';
                msgDiv.innerText = 'خطأ في الاتصال بالسيرفر!';
            }
        }

        // تسجيل الخروج
        function logout() {
            localStorage.removeItem('adminToken');
            document.getElementById('login-screen').style.display = 'block';
            document.getElementById('dashboard').style.display = 'none';
        }
    </script>
</body>
</html>
