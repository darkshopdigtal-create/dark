<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفعيل ChatGPT Business - Ghost Store</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0f19; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background-color: #1e293b; padding: 35px; border-radius: 16px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4); width: 100%; max-width: 480px; border: 1px solid #334155; }
        h2 { text-align: center; margin-bottom: 20px; color: #f8fafc; font-size: 20px; }
        .badge { background: #0284c7; color: white; padding: 4px 10px; border-radius: 6px; font-size: 12px; display: inline-block; margin-bottom: 15px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-size: 13px; color: #94a3b8; }
        input, textarea { width: 100%; padding: 10px 12px; background-color: #0f172a; border: 1px solid #334155; border-radius: 8px; color: white; font-size: 13px; outline: none; }
        textarea { height: 90px; resize: none; }
        input:focus, textarea:focus { border-color: #38bdf8; }
        button { width: 100%; padding: 12px; background-color: #16a34a; border: none; border-radius: 10px; color: white; font-size: 15px; font-weight: 600; cursor: pointer; }
        button:hover { background-color: #15803d; }
        #status-message { margin-top: 15px; text-align: center; font-size: 13px; }
        .loading { color: #facc15; } .success { color: #4ade80; } .error { color: #f87171; }
    </style>
</head>
<body>

    <div class="container">
        <h2>تفعيل الباقة المخصصة (3 مقاعد)</h2>
        <div style="text-align: center;"><span class="badge">Ghost Store System</span></div>
        
        <form id="activate-form">
            <!-- خانة كود التفعيل CDK -->
            <div class="form-group">
                <label for="cdk_input">كود التفعيل الخاص بك (CDK)</label>
                <input type="text" id="cdk_input" placeholder="مثال: GHOST-XXXX" required>
            </div>

            <!-- خانة جلسة شات جي بي تي -->
            <div class="form-group">
                <label for="session_data">بيانات الجلسة (ChatGPT Session / Access Token)</label>
                <textarea id="session_data" placeholder='الصق محتوى الـ session أو التوكن هنا...' required></textarea>
            </div>

            <button type="submit" id="submit-btn">إتمام التفعيل الأوتوماتيكي</button>
        </form>

        <div id="status-message"></div>
    </div>

    <script>
        // سحب الـ CDK تلقائياً إذا كان مخزناً من الصفحة الرئيسية
        const savedCdk = localStorage.getItem('valid_cdk');
        if (savedCdk) {
            document.getElementById('cdk_input').value = savedCdk;
        }

        document.getElementById('activate-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const cdk = document.getElementById('cdk_input').value.trim();
            let rawSessionData = document.getElementById('session_data').value.trim();
            const statusDiv = document.getElementById('status-message');
            const submitBtn = document.getElementById('submit-btn');

            statusDiv.className = 'loading';
            statusDiv.innerText = 'جاري معالجة الجلسة وتنفيذ الترقية أوتوماتيكياً...';
            submitBtn.disabled = true;

            let sessionDataToSend = rawSessionData;
            try {
                JSON.parse(rawSessionData);
            } catch (err) {
                sessionDataToSend = JSON.stringify({ accessToken: rawSessionData });
            }

            try {
                const response = await fetch('/api/activate-business', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cdk, sessionData: sessionDataToSend })
                });

                const data = await response.json();

                if (response.ok) {
                    statusDiv.className = 'success';
                    statusDiv.innerText = data.message || 'تم التفعيل بنجاح!';
                    localStorage.removeItem('valid_cdk');
                } else {
                    statusDiv.className = 'error';
                    statusDiv.innerText = 'فشل: ' + (data.message || 'خطأ في التفعيل.');
                    submitBtn.disabled = false;
                }
            } catch (error) {
                statusDiv.className = 'error';
                statusDiv.innerText = 'حدث خطأ في الاتصال بالسيرفر.';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
